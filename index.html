<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

:root {
    --cream: #fff8ef;
    --pink: #f7dce1;
    --brown: #49342f;
    --green: #55765b;
    --dark-green: #304c39;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--cream);
    color: var(--brown);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: auto;
}

.site {
    width: 100%;
    min-width: 900px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    isolation: isolate;
}

.navbar {
    position: relative;
    z-index: 5;
}

.hero {
    position: relative;
    z-index: 1;
}

/* NAVBAR */

.navbar {
    height: 90px;
    padding: 0 65px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eadfd4;
    position: relative;
    z-index: 5;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -1px;
}

.logo span {
    color: #ba7b85;
}

.nav-tag {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9b8175;
}

/* HERO */

.hero {
    position: relative;
    min-height: 690px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 55px 0 90px;
    isolation: isolate;
}

.hero-content {
    position: relative;
    z-index: 6;
    width: min(440px, 90%);
    text-align: center;
    margin-top: -10px;
}

.eyebrow {
    display: inline-block;
    border: 1px solid #e8c9c8;
    color: #ad727a;
    padding: 9px 16px;
    border-radius: 30px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 27px;
}

.hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 57px;
    line-height: 1.15;
    letter-spacing: -2px;
    font-weight: 600;
    margin-bottom: 20px;
}

.hero h1 em {
    color: #c27e8a;
    font-weight: 500;
}

.description {
    color: #987e72;
    font-size: 14px;
    line-height: 1.9;
    margin-bottom: 35px;
}

.gift-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--brown);
    color: white;
    border: none;
    border-radius: 4px;
    min-width: 245px;
    padding: 20px 25px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 9px 25px #49342f20;
    transition: transform .3s, background .3s, box-shadow .3s;
}

.gift-button:hover {
    background: #74504a;
    transform: translateY(-4px);
    box-shadow: 0 15px 30px #49342f30;
}

.button-arrow {
    font-size: 19px;
    font-weight: 400;
}

.bottom-note {
    margin-top: 23px;
    color: #b19a8d;
    font-size: 11px;
    letter-spacing: 1px;
}

/* DECORATIVE CIRCLES */

.circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
}

.circle-left {
    width: 200px;
    height: 200px;
    background: #f7e6df;
    left: 990px;
    top: 380px;
    z-index: -9;
}

.circle-right {
    width: 210px;
    height: 210px;
    background: #f6e3e5;
    right: 120px;
    bottom: 100px;
}

/* BAMBOO FOREST */

.bamboo {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 90px;
    opacity: .95;
    transform-origin: bottom center;
    animation: bambooSway 5s ease-in-out infinite;
    pointer-events: none;
}

.bamboo-left { left: 0; }
.bamboo-right { right: 0; }

.bamboo::before {
    content: '';
    position: absolute;
    left: 35px;
    top: 0;
    bottom: 0;
    width: 15px;
    background: linear-gradient(
        90deg,
        #355b3c 0%,
        #557f4d 25%,
        #83a96c 48%,
        #557b49 72%,
        #304f36 100%
    );
    border-radius: 10px;
    box-shadow: inset 2px 0 2px #ffffff30, 3px 0 8px #355b3c18;
}

.bamboo::after {
    content: '';
    position: absolute;
    left: 33px;
    top: 24%;
    width: 19px;
    height: 4px;
    border-radius: 5px;
    background: #355438;
    box-shadow:
        0 100px 0 #355438,
        0 200px 0 #355438,
        0 300px 0 #355438,
        0 400px 0 #355438;
}

.bamboo i {
    position: absolute;
    z-index: 2;
    width: 55px;
    height: 18px;
    background: linear-gradient(180deg, #88aa72, #537e4b);
    border-radius: 100% 0 100% 0;
    transform-origin: 0% 50%;
}

.bamboo i:nth-child(1) {
    top: 45px;
    left: 42px;
    transform: rotate(-25deg);
}

.bamboo i:nth-child(2) {
    top: 105px;
    left: 35px;
    transform: rotate(205deg);
}

.bamboo i:nth-child(3) {
    top: 175px;
    left: 42px;
    transform: rotate(-20deg);
}

.bamboo i:nth-child(4) {
    top: 245px;
    left: 35px;
    transform: rotate(205deg);
}

.bamboo i:nth-child(5) {
    top: 315px;
    left: 42px;
    transform: rotate(-25deg);
}

@keyframes bambooSway {
    0%, 100% { rotate: -2deg; }
    50% { rotate: 2deg; }
}

.bamboo-right { animation-delay: -2.5s; }

.bamboo-one { z-index: 1; }

.bamboo-two {
    z-index: 0;
    opacity: .75;
}

.bamboo-left.bamboo-two {
    left: 35px;
    transform-origin: bottom center;
    animation-delay: -1.8s;
    scale: .85;
    animation-duration: 6s;
}

.bamboo-right.bamboo-two {
    right: 35px;
    transform-origin: bottom center;
    animation-delay: -3.2s;
    scale: .85;
    animation-duration: 5.5s;
}

.bamboo-left.bamboo-three {
    left: 12px;
    scale: .72;
    opacity: .85;
    animation-duration: 7s;
    animation-delay: -2s;
    z-index: 0;
}

.bamboo-left.bamboo-four {
    left: -18px;
    scale: .92;
    opacity: .95;
    animation-duration: 5.8s;
    animation-delay: -3.5s;
    z-index: 2;
}

.bamboo-left.bamboo-five {
    left: 65px;
    scale: .62;
    opacity: .72;
    animation-duration: 6.5s;
    animation-delay: -1.2s;
    z-index: 0;
}

.bamboo-right.bamboo-three {
    right: 12px;
    scale: .72;
    opacity: .85;
    animation-duration: 6.8s;
    animation-delay: -2.7s;
    z-index: 0;
}

.bamboo-right.bamboo-four {
    right: -18px;
    scale: .92;
    opacity: .95;
    animation-duration: 5.6s;
    animation-delay: -4s;
    z-index: 2;
}

.bamboo-right.bamboo-five {
    right: 65px;
    scale: .62;
    opacity: .72;
    animation-duration: 7.2s;
    animation-delay: -1.5s;
    z-index: 0;
}

/* GRASS GROUND */

.grass-ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 175px;
    overflow: hidden;
    pointer-events: none;
    z-index: 4;
}

.grass-layer {
    position: absolute;
    left: -10px;
    right: -10px;
    bottom: -3px;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    height: 100%;
}

.grass-layer i {
    display: block;
    flex: 0 0 8px;
    height: 35px;
    background: linear-gradient(to top, #426a43, #7fa96b);
    border-radius: 100% 0 0 0;
    transform-origin: bottom center;
    animation: grassSway 2.8s ease-in-out infinite alternate;
}

.grass-back {
    height: 65px;
    opacity: .65;
}

.grass-back i {
    flex-basis: 5px;
    height: 25px;
    background: linear-gradient(to top, #537d4d, #9bbd83);
    animation-duration: 3.6s;
}

.grass-middle {
    height: 100px;
    opacity: .85;
}

.grass-middle i {
    flex-basis: 7px;
    height: 40px;
    animation-duration: 2.7s;
}

.grass-front { height: 135px; }

.grass-front i {
    flex-basis: 9px;
    height: 52px;
    background: linear-gradient(to top, #355a3b, #638d52);
    animation-duration: 3.2s;
}

.grass-layer i:nth-child(3n) { height: 65px; }
.grass-layer i:nth-child(4n) { height: 32px; }
.grass-layer i:nth-child(5n) { height: 45px; }
.grass-layer i:nth-child(odd) { animation-delay: -1.2s; }
.grass-layer i:nth-child(3n) { animation-delay: -2s; }
.grass-layer i:nth-child(4n) { animation-delay: -.7s; }

@keyframes grassSway {
    0% { transform: rotate(-13deg); }
    100% { transform: rotate(16deg); }
}

/* =====================================================
   SLEEPY PANDA � CSS SHAPES
===================================================== */

/* Panda position and size */
.panda-side {
  position: absolute;
  bottom: 25px;
  z-index: 5;
  font-size: clamp(12px, 1.6vw, 19px);
}

.left-side {
  left: auto;
  right: 5%;
}

.panda-card {
    position: relative;
    flex: 0 0 20em;
    width: 20em;
    height: 18em;
}

.panda-caption {
    position: absolute;
    left: 50%;
    bottom: -1.5em;
    transform: translateX(-50%);
    z-index: 40;
    padding: 2px 14px 3px;
    border-radius: 20px;
    background: rgba(255, 248, 239, .9);
    box-shadow: 0 2px 6px rgba(48, 76, 57, .18);
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-style: italic;
    color: #80665b;
    white-space: nowrap;
}

.panda {
    position: relative;
    width: 20em;
    height: 18em;
    isolation: isolate;
}

.panda div {
    position: absolute;
}

/* PANDA MATERIALS */

.panda .fur {
    background: radial-gradient(
        circle at 34% 26%,
        #ffffff 0%,
        #fbf9f5 30%,
        #efeae2 64%,
        #d8d0c6 100%
    );
    box-shadow:
        0 0 .07em rgba(186, 172, 158, .45),
        inset -.5em -.7em 1.1em rgba(112, 94, 78, .24),
        inset .45em .5em .7em rgba(255, 255, 255, .9);
}

.panda .ink {
    background: radial-gradient(
        circle at 34% 26%,
        #5d5955 0%,
        #373432 36%,
        #1d1c1b 74%,
        #100f0f 100%
    );
    box-shadow:
        inset -.4em -.55em .8em rgba(0, 0, 0, .5),
        inset .3em .35em .5em rgba(255, 255, 255, .14);
}

.panda .patch {
    border-radius: 50%;
    background: radial-gradient(
        circle at 38% 28%,
        #55504c 0%,
        #272523 45%,
        #121111 100%
    );
    box-shadow: inset -.25em -.3em .5em rgba(0, 0, 0, .5);
}

.panda .muzzle {
    border-radius: 50%;
    background: radial-gradient(
        circle at 42% 30%,
        #fffefb 0%,
        #f1ebe2 65%,
        #ddd3c7 100%
    );
    box-shadow: inset 0 -.25em .45em rgba(120, 100, 84, .2);
}

.panda .nose {
    border-radius: 46% 46% 54% 54% / 38% 38% 62% 62%;
    background: radial-gradient(
        circle at 35% 28%,
        #7a7470 0 14%,
        #2a2827 40%,
        #0e0d0d 100%
    );
}

.panda .cheek {
    border-radius: 50%;
    background: radial-gradient(
        ellipse,
        rgba(244, 146, 160, .55) 0%,
        rgba(244, 146, 160, 0) 70%
    );
}

.panda .ear { border-radius: 50%; }

.panda .ear::after {
    content: '';
    position: absolute;
    left: 24%;
    top: 24%;
    width: 52%;
    height: 52%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #6a6561, #3a3735 80%);
}

.panda .belly {
    border-radius: 50%;
    background: radial-gradient(
        ellipse at 45% 35%,
        rgba(255, 255, 255, .95),
        rgba(255, 255, 255, 0) 72%
    );
}

.panda .shut {
    border-bottom: .26em solid #f3eee5;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
}

.panda .sole {
    border-radius: 50%;
    background: radial-gradient(
        circle at 40% 30%,
        #8a847e,
        #57524e 68%,
        #3e3a37 100%
    );
    box-shadow: inset 0 -.2em .3em rgba(0, 0, 0, .35);
}

.panda .sole::before {
    content: '';
    position: absolute;
    left: .15em;
    top: -.8em;
    width: .6em;
    height: .75em;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #8a847e, #57524e 75%);
    box-shadow:
        .65em -.15em 0 #6a645f,
        1.3em -.15em 0 #6a645f,
        1.95em 0 0 #6a645f;
}

/* PANDA GROUND DETAILS */

.panda .turf {
    z-index: 0;
    border-radius: 50%;
    background: radial-gradient(
        ellipse at 50% 42%,
        #8ab373 0%,
        #77a164 42%,
        #5f8b53 68%,
        rgba(95, 139, 83, 0) 100%
    );
}

.panda .cast {
    z-index: 0;
    border-radius: 50%;
    background: radial-gradient(
        ellipse at center,
        rgba(30, 44, 26, .55) 0%,
        rgba(30, 44, 26, .3) 46%,
        rgba(30, 44, 26, 0) 72%
    );
    filter: blur(.12em);
}

.panda .tuft {
    z-index: 30;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
}

.panda .tuft i {
    display: block;
    position: relative;
    flex: 0 0 .6em;
    height: 1.5em;
    border-radius: 100% 0 0 0;
    background: linear-gradient(to top, #3b6140, #86b06f);
    transform-origin: bottom center;
    animation: grassSway 3s ease-in-out infinite alternate;
}

.panda .tuft i:nth-child(odd) {
    animation-delay: -1.6s;
}

.panda .tuft i:nth-child(3n) {
    height: 2.1em;
    animation-duration: 2.6s;
}

.panda .tuft i:nth-child(4n) {
    height: 1.1em;
    animation-delay: -1.1s;
}

.panda .tuft i:nth-child(5n) {
    height: 1.8em;
    background: linear-gradient(to top, #4a7347, #97bd7f);
}

.panda .zzz {
    z-index: 12;
    color: #b57c86;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    animation: zzz 2.6s ease-in-out infinite;
}

/* SLEEPY PANDA GROUND */

.p1 .turf {
    left: -.5em;
    top: 13.2em;
    width: 21em;
    height: 4.8em;
}

.p1 .cast.c-body {
    left: .2em;
    top: 14.3em;
    width: 13.4em;
    height: 2.8em;
}

.p1 .cast.c-rock {
    left: 10.4em;
    top: 14.5em;
    width: 10.4em;
    height: 2.6em;
}

/* ROCK */

.p1 .rock {
    z-index: 1;
    left: 11.3em;
    top: 3.3em;
    width: 8.5em;
    height: 12.5em;
    border-radius: 44% 50% 20% 18% / 32% 38% 9% 11%;
    background:
        radial-gradient(ellipse at 30% 16%, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 38%),
        radial-gradient(ellipse at 78% 78%, rgba(36,30,26,.4) 0%, rgba(36,30,26,0) 58%),
        linear-gradient(165deg, #b3ada3 0%, #938d84 42%, #6f6a62 100%);
    box-shadow:
        inset -.9em -1.1em 1.5em rgba(28,22,18,.38),
        inset .5em .6em 1em rgba(255,255,255,.2),
        0 .3em .6em rgba(20,30,16,.2);
}

.p1 .rock::before {
    content: '';
    position: absolute;
    left: 40%;
    top: 46%;
    width: 34%;
    height: .14em;
    border-radius: .1em;
    background: rgba(40,34,30,.4);
    transform: rotate(-26deg);
    box-shadow: .5em .35em 0 rgba(40,34,30,.25);
}

.p1 .moss {
    left: 10%;
    top: 1.5%;
    width: 48%;
    height: 13%;
    border-radius: 50% 50% 45% 45%;
    background: radial-gradient(ellipse at 40% 40%, #86ae6f, #5b8650 80%);
    box-shadow: .1em .2em .3em rgba(0,0,0,.2);
}

.p1 .stone {
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #b8b2a8, #8b857c 60%, #6b665e);
    box-shadow: .1em .2em .3em rgba(30,40,24,.35);
}

.p1 .st1 {
    z-index: 2;
    left: 18em;
    top: 14.7em;
    width: 1.9em;
    height: 1.2em;
}

.p1 .st2 {
    z-index: 2;
    left: 10.8em;
    top: 15.1em;
    width: 1.3em;
    height: .8em;
}

/* BODY */

.p1 .torso {
    z-index: 3;
    left: 3.55em;
    top: 6.4em;
    width: 11.5em;
    height: 8.4em;
    border-radius: 50%;
    transform: rotate(-50deg);
    background:
        radial-gradient(ellipse at 100% 45%, #1f1e1c 0 36%, rgba(31,30,28,0) 62%),
        radial-gradient(circle at 36% 28%, #ffffff 0%, #f7f3ed 35%, #e9e2d8 70%, #d3cabf 100%);
    box-shadow:
        0 0 .07em rgba(186,172,158,.45),
        inset -.6em -.8em 1.2em rgba(110,92,76,.25),
        inset .5em .6em .8em rgba(255,255,255,.8);
    animation: pandaBreathe 4.2s ease-in-out infinite;
}

.p1 .torso .belly {
    left: 24%;
    top: 16%;
    width: 46%;
    height: 60%;
}

/* LEGS */

.p1 .leg-far {
    z-index: 2;
    left: 5.4em;
    top: 11.2em;
    width: 4.8em;
    height: 3.7em;
    border-radius: 50%;
    filter: brightness(.85);
}

.p1 .foot-far {
    z-index: 2;
    left: 2em;
    top: 11.3em;
    width: 5em;
    height: 2.8em;
    border-radius: 50% 42% 42% 50%;
    transform: rotate(-9deg);
    filter: brightness(.85);
}

.p1 .leg-near {
    z-index: 5;
    left: 4.4em;
    top: 10.6em;
    width: 6.2em;
    height: 4.8em;
    border-radius: 50% 50% 46% 46%;
}

.p1 .foot-near {
    z-index: 5;
    left: .4em;
    top: 12.4em;
    width: 5.8em;
    height: 3.1em;
    border-radius: 50% 42% 42% 50%;
    transform: rotate(-5deg);
}

.p1 .foot-near .sole {
    left: .45em;
    top: .45em;
    width: 1.6em;
    height: 2.1em;
}

.p1 .foot-near .sole::before {
    display: none;
}

/* ARMS */

.p1 .arm-far {
    z-index: 4;
    left: 7.1em;
    top: 9.7em;
    width: 5.2em;
    height: 2.6em;
    border-radius: 50%;
    transform: rotate(-55deg);
    filter: brightness(.85);
}

.p1 .paw-far {
    z-index: 4;
    left: 7em;
    top: 11.85em;
    width: 2.4em;
    height: 2.3em;
    border-radius: 50%;
    filter: brightness(.85);
}

.p1 .arm-near {
    z-index: 7;
    left: 6em;
    top: 8.3em;
    width: 5.8em;
    height: 2.8em;
    border-radius: 50%;
    transform: rotate(-37deg);
}

.p1 .paw-near {
    z-index: 8;
    left: 5.3em;
    top: 10.1em;
    width: 2.7em;
    height: 2.5em;
    border-radius: 50%;
}

/* HEAD */

.p1 .head-wrap {
    z-index: 9;
    left: 4.9em;
    top: 1.6em;
    width: 8.6em;
    height: 7.6em;
    transform: rotate(-12deg);
    transform-origin: 50% 80%;
    animation: pandaNod 5.5s ease-in-out infinite;
}

.p1 .ear.e-far {
    left: .2em;
    top: -.5em;
    width: 2.6em;
    height: 2.6em;
}

.p1 .ear.e-near {
    left: 5.7em;
    top: -.9em;
    width: 3.1em;
    height: 3.1em;
}

.p1 .skull {
    inset: 0;
    border-radius: 48% 48% 46% 46% / 54% 54% 46% 46%;
}

.p1 .cheek.ck-l {
    left: .2em;
    top: 4.9em;
    width: 2em;
    height: 1.3em;
}

.p1 .cheek.ck-r {
    left: 5.5em;
    top: 4.9em;
    width: 2em;
    height: 1.3em;
}

.p1 .patch.pf {
    left: 1.1em;
    top: 2.6em;
    width: 2.2em;
    height: 2.9em;
    transform: rotate(24deg);
}

.p1 .patch.pn {
    left: 4.7em;
    top: 2.4em;
    width: 2.5em;
    height: 3.2em;
    transform: rotate(-22deg);

.p1 .pf .shut {

}

<script>
/* OPEN PASSWORD PAGE */

function openGift() {
    document.body.classList.add('password-open');

    setTimeout(() => {
        document.getElementById('passwordInput').focus();
    }, 500);
}

/* BACK TO HOME */

function goHome() {
    document.body.classList.remove('password-open');

    document.getElementById('passwordMessage').textContent = '';
    document.getElementById('passwordInput').value = '';
}

/* PASSWORD CHECK */

let wrongPasswordTimer;

function checkPassword(event) {
    event.preventDefault();

    const correctPassword = "18/02/2022";
    const passwordInput = document.getElementById('passwordInput');
    const enteredPassword = passwordInput.value;
    const popup = document.getElementById('wrongPasswordPopup');

    if (enteredPassword === correctPassword) {
        clearTimeout(wrongPasswordTimer);
        window.location.href = "magazine.html";
        return;
    }

    clearTimeout(wrongPasswordTimer);

    popup.classList.remove('show');

    // Restart the image animation
    void popup.offsetWidth;

    popup.classList.add('show');
    passwordInput.value = '';

    // Hide the image after the animation
    wrongPasswordTimer = setTimeout(() => {
        popup.classList.remove('show');
    }, 3000);
}
</script>
